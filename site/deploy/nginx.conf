# Cloudflare does not strip the path, so /docs/... arrives with the prefix and it is removed here.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /srv/www;
    index index.html;
    # relative redirects, so /docs stays on the https origin behind Cloudflare
    absolute_redirect off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /docs {
        return 301 /docs/;
    }

    # hashed assets: cache forever
    location ~ ^/docs/_astro/ {
        rewrite ^/docs/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # screenshots and OG cards: cache for a week
    location ~ ^/docs/(?:img|og)/ {
        rewrite ^/docs/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location /docs/ {
        rewrite ^/docs/(.*)$ /$1 break;

        # the static search index is a file without an extension
        default_type application/json;

        try_files $uri/index.html $uri $uri.html =404;

        # HTML changes on every deploy
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
}
